{% extends base_template %}

{% block content %}
<div class="p-4 sm:p-6 lg:p-8 space-y-6 w-full max-w-full">
    <div>
        <h1 class="text-2xl font-bold text-gray-900 dark:text-white">Form Components & Layouts</h1>
        <p class="text-sm text-gray-500 dark:text-gray-400">Standardized accessible form controls for bakery workflows</p>
    </div>

    <div class="bg-white dark:bg-gray-800 rounded-2xl border border-gray-100 dark:border-gray-700/60 p-6 shadow-xs space-y-6">
        <h2 class="text-lg font-bold text-gray-900 dark:text-white border-b border-gray-100 dark:border-gray-700 pb-3">Input Fields Preview</h2>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Standard Text Field</label>
                <input type="text" placeholder="e.g. Vanilla Buttercream Cake" class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-sm outline-none focus:ring-2 focus:ring-amber-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Select Dropdown</label>
                <select class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-sm outline-none focus:ring-2 focus:ring-amber-500">
                    <option>Select Bakery Category</option>
                    <option>Pastries & Breads</option>
                    <option>Custom Celebration Cakes</option>
                    <option>Beverages & Coffee</option>
                </select>
            </div>
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Textarea (Special Instructions)</label>
            <textarea rows="3" placeholder="Enter custom message piping notes, allergen alerts, or pickup instructions..." class="w-full px-4 py-2.5 rounded-xl border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-900 text-gray-900 dark:text-white text-sm outline-none focus:ring-2 focus:ring-amber-500"></textarea>
        </div>

        <div class="flex items-center gap-3">
            <input type="checkbox" id="demo_cb" checked class="w-4 h-4 rounded text-amber-500 focus:ring-amber-400">
            <label for="demo_cb" class="text-sm text-gray-700 dark:text-gray-300">Notify kitchen prep team upon booking confirmation</label>
        </div>
    </div>
</div>
{% endblock %}
