{# Reusable DHAT Modal Component (Alpine.js + HTMX) #}
{# Usage: Render into #modal-container or include in template with x-data="{ open: true }" #}
<div 
    x-data="{ open: true }" 
    x-show="open" 
    x-cloak
    @keydown.escape.window="open = false; setTimeout(() => $el.remove(), 250)"
    class="fixed inset-0 z-99999 overflow-y-auto"
    aria-labelledby="modal-title" 
    role="dialog" 
    aria-modal="true"
>
    <!-- Backdrop Blur -->
    <div 
        x-show="open"
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        @click="open = false; setTimeout(() => $el.closest('.fixed').remove(), 250)"
        class="fixed inset-0 bg-gray-900/60 backdrop-blur-sm transition-opacity"
    ></div>

    <!-- Modal Card Container -->
    <div class="flex min-h-full items-center justify-center p-4 text-center sm:p-0">
        <div 
            x-show="open"
            x-transition:enter="ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
            x-transition:enter-end="opacity-100 translate-y-0 sm:scale-100"
            x-transition:leave="ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0 sm:scale-100"
            x-transition:leave-end="opacity-0 translate-y-4 sm:translate-y-0 sm:scale-95"
            class="relative transform overflow-hidden rounded-2xl bg-white dark:bg-gray-800 text-left shadow-2xl transition-all sm:my-8 sm:w-full sm:max-w-lg border border-gray-100 dark:border-gray-700/60 p-6 space-y-6"
        >
            <div class="flex items-center justify-between border-b border-gray-100 dark:border-gray-700 pb-4">
                <h3 class="text-lg font-bold text-gray-900 dark:text-white" id="modal-title">
                    {{ modal_title|default:"Modal Window" }}
                </h3>
                <button 
                    @click="open = false; setTimeout(() => $el.closest('.fixed').remove(), 250)"
                    type="button" 
                    class="rounded-lg p-1.5 text-gray-400 hover:bg-gray-100 hover:text-gray-900 dark:hover:bg-gray-700 dark:hover:text-white transition"
                >
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                    </svg>
                </button>
            </div>

            <div class="modal-body text-gray-600 dark:text-gray-300 text-sm">
                {{ modal_content|default:"" }}
            </div>
        </div>
    </div>
</div>
