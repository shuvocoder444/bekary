{# Usage: {% include 'components/search_input.html' with search_url='/products/' target_id='#table-container' placeholder='Search items...' %} #}
<div class="relative w-full max-w-sm">
    <div class="absolute inset-y-0 left-0 flex items-center pl-3.5 pointer-events-none text-gray-400">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
        </svg>
    </div>
    <input 
        type="search" 
        name="search" 
        hx-get="{{ search_url }}" 
        hx-trigger="keyup changed delay:400ms, search" 
        hx-target="{{ target_id|default:'#main-content' }}" 
        hx-push-url="true"
        hx-indicator="#search-spinner"
        class="w-full pl-10 pr-4 py-2 bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-xl text-sm text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-amber-500 focus:bg-white dark:focus:bg-gray-900 transition duration-150"
        placeholder="{{ placeholder|default:'Search...' }}"
    >
    <div id="search-spinner" class="htmx-indicator absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none">
        <svg class="animate-spin w-4 h-4 text-amber-500" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
    </div>
</div>
