<form hx-post="{% url 'login' %}" 
      hx-target="#login-form-container" 
      hx-swap="innerHTML" 
      class="space-y-5">
    
    {% csrf_token %}

    {% if error %}
    <div x-data="{ show: true }" x-show="show" class="bg-rose-50 dark:bg-rose-950/50 border-l-4 border-rose-500 p-3.5 rounded-lg flex justify-between items-start">
        <div class="flex">
            <div class="flex-shrink-0">
                <svg class="h-5 w-5 text-rose-500" viewBox="0 0 20 20" fill="currentColor">
                    <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8.707 7.293a1 1 0 00-1.414 1.414L8.586 10l-1.293 1.293a1 1 0 101.414 1.414L10 11.414l1.293 1.293a1 1 0 001.414-1.414L11.414 10l1.293-1.293a1 1 0 00-1.414-1.414L10 8.586 8.707 7.293z" clip-rule="evenodd" />
                </svg>
            </div>
            <div class="ml-3">
                <p class="text-xs font-semibold text-rose-700 dark:text-rose-300">{{ error }}</p>
            </div>
        </div>
        <button type="button" @click="show = false" class="text-rose-400 hover:text-rose-600 focus:outline-none">
            <span class="sr-only">Close</span>
            <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clip-rule="evenodd" /></svg>
        </button>
    </div>
    {% endif %}

    <div>
        <label for="username" class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5">Email or Phone Number</label>
        <div>
            <input type="text" name="username" id="username" value="{{ username|default:'' }}" required autocomplete="off"
                   class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition"
                   placeholder="e.g. admin@bakemaster.com or 017...">
        </div>
    </div>

    <div>
        <label for="password" class="block text-xs font-semibold uppercase tracking-wider text-gray-700 dark:text-gray-300 mb-1.5">Password</label>
        <div>
            <input type="password" name="password" id="password" required
                   class="w-full px-3.5 py-2.5 rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-800 text-gray-900 dark:text-white text-sm focus:ring-2 focus:ring-amber-500 focus:border-transparent outline-none transition"
                   placeholder="••••••••">
        </div>
    </div>

    <div>
        <button type="submit"
                class="w-full flex justify-center items-center py-2.5 px-4 rounded-lg text-sm font-bold text-white bg-amber-600 hover:bg-amber-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-amber-500 relative transition shadow-md">
            <span class="htmx-indicator absolute left-1/2 -translate-x-1/2 hidden">
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            </span>
            <span class="submit-text">Sign In</span>
        </button>
    </div>
</form>
